<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121417">
<title>Lampor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#121417;--card:#1D2126;--card2:#262B31;--line:#2A3037;--txt:#F2EFE9;--mut:#A7ADB5;
  --amber:#F2A33A;--amberbg:#2A2116;--amberline:#4A3718;--track:#2E343B;--danger:#E5484D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);display:flex;align-items:center;justify-content:center}
.status{font-size:13px;color:var(--mut);min-height:0;margin:0 0 10px}
.status:empty{margin:0}
.status.err{color:var(--danger)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px;position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;height:42px;border:none;border-radius:12px;background:transparent;color:var(--mut);font-size:12px;font-weight:650;padding:0 10px;white-space:nowrap;letter-spacing:-.2px;overflow:hidden;text-overflow:clip}
.tab.active{background:var(--amber);color:#1A1305}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5;border:1px dashed var(--line);border-radius:20px}
.scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
.scene{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.scene:active{background:var(--card2)}
.scene.off{background:#3A1F1F;color:#FFD9D9;border:1px solid #5A2C2C}
.floor{margin:18px 0 8px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.zone{position:relative;overflow:hidden;border-radius:20px;background:var(--card);border:1px solid var(--line);padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;touch-action:none;transition:transform .08s}
.zone.wide{grid-column:span 2}
.zone.on{background:var(--amberbg);border-color:var(--amberline)}
.zone.pressed{transform:scale(.97)}
.zone.sw{min-height:96px}
.zone.sw.on{background:#16261C;border-color:#24543A}
.zone.sw.on .bulb{background:#46A758;color:#0B1A10}
.zone.sw .pct{font-size:17px}
.zone.offline{opacity:.45}
.watt{font-size:12px;color:var(--mut);height:15px}
.zone .fill{position:absolute;left:0;bottom:0;height:5px;background:var(--amber);width:0;transition:width .25s}
.zone .row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bulb{width:36px;height:36px;border-radius:11px;background:var(--card2);color:var(--mut);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.zone.on .bulb{background:var(--amber);color:#1A1305}
.pct{font-size:20px;font-weight:700;color:var(--mut)}
.zone.on .pct{color:var(--txt)}
.name{font-size:16px;font-weight:650;margin-top:10px;line-height:1.2}
.dir{font-size:12px;color:var(--amber);height:15px}
.temps{display:none;gap:6px;margin-top:10px}
.zone.on .temps{display:flex}
.t{flex:1;height:32px;border-radius:10px;border:2px solid var(--amberline);background:#1D1912;display:flex;align-items:center;justify-content:center}
.t.sel{border-color:#FFFFFF;background:#3A2E1D}
.colors{display:none;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:8px}
.zone.on .colors{display:grid}
.c{aspect-ratio:1;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.c.sel{border-color:#FFFFFF}
.t span{width:14px;height:14px;border-radius:7px}
.help{margin-top:22px;font-size:12px;color:var(--mut);line-height:1.5;text-align:center}
.setup{max-width:440px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.setup h2{margin:0 0 6px;font-size:20px}
.setup p{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 14px}
.setup label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.setup input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:#14171A;color:var(--txt);padding:0 12px;font-size:15px;user-select:text;-webkit-user-select:text}
.btn{width:100%;height:48px;border-radius:14px;border:none;background:var(--amber);color:#1A1305;font-weight:700;font-size:16px;margin-top:18px}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>

<section id="setup" class="setup hidden">
  <h2>Koppla till Homey</h2>
  <p>Klistra in API-nyckeln du skapade i Homey (Inställningar → API-nycklar). Den sparas bara i den här telefonen.</p>
  <label for="homeyId">Homey-ID</label>
  <input id="homeyId" autocomplete="off" spellcheck="false" value="69adf39d04f654178861fde7">
  <label for="apiKey">API-nyckel</label>
  <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Klistra in nyckeln här">
  <button class="btn" id="saveBtn">Spara och anslut</button>
  <button class="btn ghost hidden" id="cancelBtn">Avbryt</button>
  <div class="status" id="setupStatus" style="margin-top:12px"></div>
</section>

<main id="app" class="hidden">
  <div class="top">
    <h1>Lampor</h1>
    <button class="iconbtn" id="settingsBtn" aria-label="Inställningar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="status" id="status"></div>
  <div class="scenes" id="scenes"></div>
  <div id="floors"></div>
  <div class="help">Tryck = tänd/släck · Håll in = dimra upp · Släpp och håll igen = dimra ner</div>
</main>

<script>
// ---- Konfiguration: zoner (grupp-enheter i Homey) ----
const PAGES = [
  { key: 'botten', name: 'Bottenvåning', sections: [
    { name: 'Hela våningen', zones: [
      { id: '82351d3e-ff80-4ac3-bf93-051f7105161f', name: 'Vardagsrum', wide: true },
      { id: 'a0686c67-4a06-4723-82cc-dbb49a73f01b', name: 'Kök' },
      { id: '7c602ef4-7ea0-4d0e-bde2-7e18dabb4389', name: 'Entré' },
    ]},
    { name: 'Kök', zones: [
      { id: '2dd5c7b9-61e1-4349-bb83-7444ade7f5be', name: 'Köksbänk' },
      { id: 'a43e3e8b-181a-4316-ab9d-08a1c4b7a8cb', name: 'Köksön' },
    ]},
    { name: 'Vardagsrum', zones: [
      { id: '9d9dd3c5-d4b1-43d0-a636-49b1a50a0c5c', name: 'Ginhörnan' },
      { id: 'e8b967eb-ced9-4ab0-bf51-b4fd94446935', name: 'Middagsbord' },
      { id: 'b4eda532-b54d-400e-8e46-3f95280347ce', name: 'Höger' },
      { id: '9b480d47-fe8b-4927-9f5a-5b8311de3bd7', name: 'Mitten' },
      { id: '30544e8b-e6c2-4656-99ff-90f0597eb09a', name: 'Vänster' },
      { id: '3ac6c467-bccc-4c84-a853-d948b8db2bc8', name: 'TV-belysning', wide: true, colors: ['6129d248-3386-4ca1-b1f1-0cd9c0c57e09','3ff61ca7-4d1f-41a6-af3d-c6a7e1ecd5ed','809dc059-10e3-48b5-9dac-b9fcbd599a5b','bc6f628d-36b1-41d5-9796-d51076504d7a','27582ca7-53af-4bdc-8334-307105a857a9','03d8927a-b897-494d-9b0a-5e2666a08c5e','43664ba8-22d1-4931-b908-0b269f34cbbc','dc5e6d13-7d5b-4f92-a1f7-e20d566c5e77','e7e46f94-c970-49cd-83cc-0db131a18234'] },
    ]},
    { name: 'Övrigt', zones: [
      { id: '01f58209-c810-4bb4-979d-8699f250ef4f', name: 'Gästrum bv' },
    ]},
  ]},
  { key: 'over', name: 'Övervåning', sections: [
    { name: 'Rum', zones: [
      { id: 'cc806e65-03fb-4905-a2f7-181d8574ea51', name: 'Sovrum' },
      { id: '56422ee9-3796-4615-b693-3204c9f92da0', name: 'Gästrum öv' },
    ]},
  ]},
  { key: 'garage', name: 'Garage', sections: [], empty: 'Det finns inga lampor i garaget i Homey ännu. När du lägger till lampor där kan jag lägga in dem här.' },
  { key: 'ute', name: 'Utomhus', sections: [
    { name: 'Fasad & uppfart', zones: [
      { id: 'd2bce7a1-fd89-4226-b907-8f724d66858d', name: 'All utebelysning', wide: true },
      { id: '1b14ef1d-740f-4ab7-8149-4cdb24da448d', name: 'Fasad framsida' },
      { id: 'f66feb44-7690-4c6a-87e9-5f352c25349a', name: 'Entréstolpe front' },
      { id: '9213fb7d-ef86-4bed-88c4-f059845cc1e8', name: 'Entréstolpe uppfart' },
    ]},
  ]},
  // Strömbrytare (Smart Life/Tuya) – bara på/av. guard = fråga innan avstängning
  { key: 'el', name: 'Strömbrytare', sw: true, sections: [
    { name: 'Kök', zones: [
      { id: 'c0aea280-53a0-48be-821e-4dd2e7b12b10', name: 'Kaffebryggare' },
    ]},
    { name: 'Badrum', zones: [
      { id: '2fd43deb-4b2a-4b7f-ac98-e082b2c0e3e8', name: 'Led badrum' },
    ]},
    { name: 'Övervåning', zones: [
      { id: '167a63c5-a667-447f-abfc-a80337246848', name: 'Jordglob' },
      { id: '6418f2ef-0fd7-4299-958a-264d6ad23291', name: 'Taxlampan' },
    ]},
    { name: 'Fasad & uppfart', zones: [
      { id: 'd489f2d7-bec6-4d69-88b6-4380e13f220d', name: 'Led bambu uppfart' },
    ]},
    { name: 'Dammbelysning', zones: [
      { id: '930144d4-1c83-4f52-80d7-a2a0fd3f7fa4', name: 'Belysning vattenfall' },
      { id: '7f853126-bbee-4c35-b44b-41b2521c93c2', name: 'Dammbelysning skymning' },
    ]},
    { name: 'Trädgård – dammen', zones: [
      { id: 'c4aa13b5-96d7-4975-bd8d-c0c2c00ccaa2', name: 'Huvudström dammen', wide: true, guard: true },
      { id: '7804b297-c82d-4c4f-8799-65ee23eb4c7c', name: 'Extrapump cirkulation', guard: true },
      { id: '3a032342-5206-40e9-adf1-b39c52c19a85', name: 'Luftpump center', guard: true },
      { id: '7c20c205-b141-4db9-b5c1-bd01c8f34684', name: 'Ny luftpump center', guard: true },
      { id: '4760fc57-34a8-407a-b94c-b8e93cf49791', name: 'Pumpsystem (fd luftpump extra)', guard: true },
      { id: '4943a861-b08d-4f63-95dc-baced81a1670', name: 'Vattenfall luftpump', guard: true },
      { id: '32bb38f6-4b28-4efa-ae5b-09d8536d6197', name: 'Vattenfallpump', guard: true },
      { id: 'ffab1acf-7cea-4ac4-9081-5a0d22de00b4', name: 'Pump grundvatten', guard: true },
    ]},
    { name: 'Övriga strömbrytare', zones: [
      { id: '665a1e58-0616-4158-acf1-56fffc9ef541', name: 'WIFI', guard: true },
      { id: '080be9ed-efa5-48a0-90f9-88df8f948c04', name: 'DeWalt batteriladdare' },
    ]},
  ]},
];
const plugSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>';
let currentPage = (() => { try { return localStorage.getItem('page') || 'botten' } catch(e){ return 'botten' } })();
if (!PAGES.some(p => p.key === currentPage)) currentPage = 'botten';
// Scener = flöden i Homey ("Scen – …") som startas med knapptryck
const SCENES = [
  { label: 'Släck allt', flow: 'd3df50de-348d-425c-bfce-6450b8e2152d', primary: true },
  { label: 'Tänd nere', flow: 'b3983278-1f69-42f1-96a4-ce9a1a185cb5' },
  { label: 'Kväll', flow: '5c685373-58ce-4532-94ed-11891f5737e1' },
  { label: 'TV', flow: '89d79a92-b486-4a46-bfa9-d901c49ef3fd' },
];
const TEMPS = [ ['Kallt', 0, '#CFE3FF'], ['Neutralt', 0.5, '#FFF4E0'], ['Varmt', 1, '#FFC67A'] ];
// Färger för RGBWW-lamporna (hue 0–1)
const COLORS = [ ['Röd',0,'#E5484D'], ['Orange',0.07,'#F2853A'], ['Gul',0.14,'#F5D90A'], ['Grön',0.33,'#46A758'], ['Turkos',0.5,'#2EC4C4'], ['Blå',0.63,'#3E7BFA'], ['Lila',0.76,'#8B5CF6'], ['Rosa',0.9,'#E93D82'] ];

const HOLD_MS = 380, STEP = 0.06, TICK_MS = 220, REVERSE_WINDOW_MS = 4000, MIN_DIM = 0.01;

// ---- Lagring (bara i telefonen) ----
const store = {
  get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch(e){} },
};
let cfg = { homeyId: store.get('homeyId') || '69adf39d04f654178861fde7', key: store.get('apiKey') || '' };
const base = () => `https://${cfg.homeyId}.connect.athom.com/api`;

async function api(method, path, body){
  const res = await fetch(base() + path, {
    method,
    headers: { 'Authorization': 'Bearer ' + cfg.key, ...(body ? {'Content-Type':'application/json'} : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const t = await res.text().catch(()=> ''); throw new Error(res.status + ' ' + t.slice(0,120)); }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}
const setCap = (id, cap, value) => api('PUT', `/manager/devices/device/${id}/capability/${cap}`, { value });

// ---- UI ----
const $ = s => document.querySelector(s);
const statusEl = $('#status');
function status(msg, err){ statusEl.textContent = msg || ''; statusEl.classList.toggle('err', !!err); }

const state = {}; // id -> {on, dim, el, lastHoldEnd, lastDir}
const bulbSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>';

function renderTabs(){
  const nav = $('#tabs'); nav.innerHTML = '';
  for (const p of PAGES){
    const b = document.createElement('button');
    b.className = 'tab' + (p.key === currentPage ? ' active' : '');
    b.textContent = p.name;
    b.onclick = () => showPage(p.key);
    nav.appendChild(b);
  }
  requestAnimationFrame(() => { const a = nav.querySelector('.tab.active'); if (a) nav.scrollLeft = Math.max(0, a.offsetLeft + a.offsetWidth - nav.clientWidth + 8) > nav.scrollLeft || a.offsetLeft < nav.scrollLeft ? (a.offsetLeft < nav.scrollLeft ? a.offsetLeft - 4 : a.offsetLeft + a.offsetWidth - nav.clientWidth + 8) : nav.scrollLeft; });
}
function showPage(key){
  currentPage = key; store.set('page', key);
  renderTabs(); render(); refresh(); window.scrollTo(0,0);
}
const HELP_LAMP = 'Tryck = tänd/släck · Håll in = dimra upp · Släpp och håll igen = dimra ner';
const HELP_SW = 'Tryck = slå på/av. Pumpar och WIFI frågar innan de stängs av.';
function render(){
  const floors = $('#floors'); floors.innerHTML = '';
  for (const k of Object.keys(state)) delete state[k];
  const page = PAGES.find(p => p.key === currentPage);
  $('.help').textContent = page.sw ? HELP_SW : HELP_LAMP;
  if (page.empty && !page.sections.length){
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = page.empty; floors.appendChild(e);
  }
  for (const f of page.sections){
    const h = document.createElement('div'); h.className = 'floor'; h.textContent = f.name; floors.appendChild(h);
    const g = document.createElement('div'); g.className = 'grid'; floors.appendChild(g);
    for (const z of f.zones){
      const el = document.createElement('div');
      if (page.sw) z.sw = true;
      el.className = 'zone' + (z.wide ? ' wide' : '') + (z.sw ? ' sw' : '');
      el.innerHTML = z.sw ? `<div class="row"><div class="bulb">${plugSvg}</div><div class="pct">–</div></div>
        <div><div class="name"></div><div class="watt"></div></div><div class="fill"></div>` : `<div class="row"><div class="bulb">${bulbSvg}</div><div class="pct">–</div></div>
        <div><div class="name"></div><div class="dir"></div></div>
        <div class="temps">${TEMPS.map(t=>`<div class="t" data-t="${t[1]}" aria-label="${t[0]}"><span style="background:${t[2]}"></span></div>`).join('')}</div>
        ${z.colors ? `<div class="colors">${COLORS.map(c=>`<div class="c" data-h="${c[1]}" aria-label="${c[0]}" style="background:${c[2]}"></div>`).join('')}</div>` : ''}
        <div class="fill"></div>`;
      el.querySelector('.name').textContent = z.name;
      g.appendChild(el);
      state[z.id] = { on:false, dim:0, temp:null, mode:null, hue:null, power:null, avail:true, el, z, lastHoldEnd:0, lastDir:'down', busy:false };
      bindZone(z, el);
    }
  }
}
function renderScenes(){
  const sc = $('#scenes'); sc.innerHTML = '';
  for (const s of SCENES){
    const b = document.createElement('button');
    b.className = 'scene' + (s.primary ? ' off' : '');
    b.textContent = s.label;
    b.onclick = () => runScene(s, b);
    sc.appendChild(b);
  }
}

// svep åt vänster/höger för att byta sida
(() => {
  let sx = 0, sy = 0, t0 = 0;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; t0 = Date.now(); }, { passive: true });
  document.addEventListener('touchend', e => {
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - t0 > 600 || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
    if (document.querySelector('.zone.pressed')) return;
    const i = PAGES.findIndex(p => p.key === currentPage);
    const n = dx < 0 ? Math.min(PAGES.length - 1, i + 1) : Math.max(0, i - 1);
    if (n !== i) showPage(PAGES[n].key);
  }, { passive: true });
})();

function paint(id){
  const s = state[id]; if (!s) return;
  s.el.classList.toggle('on', s.on);
  if (s.z.sw){
    s.el.classList.toggle('offline', !s.avail);
    s.el.querySelector('.pct').textContent = !s.avail ? 'Offline' : (s.on ? 'På' : 'Av');
    s.el.querySelector('.watt').textContent = (typeof s.power === 'number') ? Math.round(s.power) + ' W' : '';
    return;
  }
  s.el.querySelector('.pct').textContent = s.on ? Math.round(s.dim*100) + ' %' : 'Av';
  s.el.querySelector('.fill').style.width = s.on ? Math.round(s.dim*100) + '%' : '0';
  const colorMode = s.mode === 'color';
  s.el.querySelectorAll('.t').forEach(t => t.classList.toggle('sel', !colorMode && s.temp !== null && Math.abs(Number(t.dataset.t) - s.temp) <= 0.17));
  s.el.querySelectorAll('.c').forEach(c => { const d = Math.abs(Number(c.dataset.h) - (s.hue ?? -9)); c.classList.toggle('sel', colorMode && Math.min(d, 1 - d) <= 0.05); });
}

function bindZone(z, el){
  let timer = null, ramp = null, holding = false, startX = 0, startY = 0, moved = false;
  const s = () => state[z.id];

  el.addEventListener('pointerdown', e => {
    if (e.target.closest('.t,.c')) return;
    el.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY; moved = false; holding = false;
    el.classList.add('pressed');
    if (!z.sw) timer = setTimeout(() => startHold(), HOLD_MS);
  });
  el.addEventListener('pointermove', e => {
    if (Math.abs(e.clientX-startX) > 12 || Math.abs(e.clientY-startY) > 12){ moved = true; clearTimeout(timer); if (!holding) el.classList.remove('pressed'); }
  });
  const end = e => {
    if (e.target.closest && e.target.closest('.t,.c')) return;
    clearTimeout(timer); el.classList.remove('pressed');
    if (holding){ stopHold(); return; }
    if (!moved && e.type === 'pointerup') toggle();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('contextmenu', e => e.preventDefault());

  el.querySelectorAll('.t').forEach(t => t.addEventListener('click', async ev => {
    ev.stopPropagation();
    const st = s(); st.temp = Number(t.dataset.t); st.mode = 'temperature'; paint(z.id); vibrate(15);
    try {
      if (z.colors) await Promise.all(z.colors.map(id => setCap(id, 'light_temperature', st.temp).catch(()=>{})));
      else await setCap(z.id, 'light_temperature', st.temp);
    } catch(err){ status('Kunde inte ändra färgtemperatur: ' + err.message, true); }
  }));
  el.querySelectorAll('.c').forEach(c => c.addEventListener('click', async ev => {
    ev.stopPropagation();
    const st = s(); st.hue = Number(c.dataset.h); st.mode = 'color'; paint(z.id); vibrate(15);
    const res = await Promise.allSettled(z.colors.map(async id => {
      await setCap(id, 'light_hue', st.hue);
      await setCap(id, 'light_saturation', 1);
    }));
    const bad = res.filter(r => r.status === 'rejected').length;
    if (bad) status(bad + ' av ' + z.colors.length + ' lampor ville inte byta färg', true); else status('');
  }));

  async function toggle(){
    const st = s(); const next = !st.on;
    if (z.sw && !next && z.guard && !confirm('Stänga av ' + z.name + '?')) return;
    st.on = next; if (next && st.dim < MIN_DIM) st.dim = 0.5; paint(z.id); vibrate(12);
    try { await setCap(z.id, 'onoff', next); status(''); }
    catch(err){ st.on = !next; paint(z.id); status('Kunde inte styra ' + z.name + ': ' + err.message, true); }
  }

  function startHold(){
    holding = true; const st = s();
    const recent = Date.now() - st.lastHoldEnd < REVERSE_WINDOW_MS;
    let dir = recent ? (st.lastDir === 'up' ? 'down' : 'up') : 'up';
    if (!st.on){ dir = 'up'; st.dim = 0; st.on = true; }
    st.lastDir = dir;
    el.querySelector('.dir').textContent = dir === 'up' ? '▲ ljusare' : '▼ mörkare';
    vibrate(25);
    const tick = async () => {
      if (!holding) return;
      let v = st.dim + (dir === 'up' ? STEP : -STEP);
      v = Math.max(MIN_DIM, Math.min(1, v));
      st.dim = v; paint(z.id);
      if (!st.busy){
        st.busy = true;
        try { await setCap(z.id, 'dim', Math.round(v*100)/100); }
        catch(err){ status('Kunde inte dimra ' + z.name + ': ' + err.message, true); }
        st.busy = false;
      }
      if (holding) ramp = setTimeout(tick, TICK_MS);
    };
    tick();
  }
  async function stopHold(){
    holding = false; clearTimeout(ramp);
    const st = s(); st.lastHoldEnd = Date.now();
    el.querySelector('.dir').textContent = '';
    // skicka slutvärdet så att lamporna landar exakt där reglaget stannade
    try { await setCap(z.id, 'dim', Math.round(st.dim*100)/100); } catch(e){}
  }
}

function vibrate(ms){ try { navigator.vibrate && navigator.vibrate(ms) } catch(e){} }

async function runScene(s, btn){
  btn.disabled = true; vibrate(20);
  try {
    await api('POST', `/manager/flow/flow/${s.flow}/trigger`);
    status(s.label + ' ✓'); setTimeout(refresh, 1500);
  } catch(err){ status('Scen ' + s.label + ': ' + err.message, true); }
  finally { btn.disabled = false; }
}

// ---- Läs av status ----
async function refresh(){
  if (document.hidden || !cfg.key) return;
  const ids = Object.keys(state).filter(id => !id.startsWith('__'));
  await Promise.all(ids.map(async id => {
    const st = state[id]; if (st.busy) return;
    try {
      const d = await api('GET', `/manager/devices/device/${id}`);
      const c = d.capabilitiesObj || {};
      st.on = !!(c.onoff && c.onoff.value);
      st.dim = (c.dim && typeof c.dim.value === 'number') ? c.dim.value : (st.on ? 1 : 0);
      if (st.z.sw){
        st.avail = d.available !== false;
        st.power = (c.measure_power && typeof c.measure_power.value === 'number') ? c.measure_power.value : null;
        paint(id); if (statusEl.textContent.startsWith('Ansluter')) status(''); return;
      }
      st.el.querySelector('.temps').style.visibility = c.light_temperature ? '' : 'hidden';
      st.temp = (c.light_temperature && typeof c.light_temperature.value === 'number') ? c.light_temperature.value : null;
      st.mode = c.light_mode ? c.light_mode.value : null;
      if (st.z.colors){
        const m = await api('GET', `/manager/devices/device/${st.z.colors[0]}`);
        const mc = m.capabilitiesObj || {};
        st.mode = mc.light_mode ? mc.light_mode.value : st.mode;
        st.hue = mc.light_hue ? mc.light_hue.value : null;
        if (mc.light_temperature) st.temp = mc.light_temperature.value;
      }
      paint(id);
      if (statusEl.textContent.startsWith('Ansluter')) status('');
    } catch(err){
      status('Ingen kontakt med Homey: ' + err.message, true);
    }
  }));
}

// ---- Uppstart ----
function showSetup(first){
  $('#setup').classList.remove('hidden'); $('#app').classList.add('hidden');
  $('#homeyId').value = cfg.homeyId; $('#apiKey').value = '';
  $('#cancelBtn').classList.toggle('hidden', first);
}
function showApp(){
  $('#setup').classList.add('hidden'); $('#app').classList.remove('hidden');
  status('Ansluter…'); refresh();
}
$('#saveBtn').onclick = async () => {
  const id = $('#homeyId').value.trim(), key = $('#apiKey').value.trim();
  if (!id || !key){ $('#setupStatus').textContent = 'Fyll i båda fälten.'; return; }
  cfg = { homeyId: id, key };
  $('#setupStatus').textContent = 'Testar anslutningen…';
  try {
    await api('GET', '/manager/devices/device/' + PAGES[0].sections[0].zones[0].id);
    store.set('homeyId', id); store.set('apiKey', key);
    $('#setupStatus').textContent = ''; showApp();
  } catch(err){ $('#setupStatus').textContent = 'Det gick inte att ansluta: ' + err.message; }
};
$('#cancelBtn').onclick = () => { cfg.key = store.get('apiKey') || ''; showApp(); };
$('#settingsBtn').onclick = () => showSetup(false);

renderTabs(); renderScenes(); render();
if (cfg.key) showApp(); else showSetup(true);
setInterval(refresh, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
